name: linkdrop
description: "LinkDrop - Cross-platform large file and video sharing app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.8
  file_picker: ^8.1.7
  desktop_drop: ^0.5.0
  share_plus: ^10.1.4
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.1
  http: ^1.3.0
  intl: ^0.20.2
  cross_file: ^0.3.4+2
  uuid: ^4.5.1
  supabase_flutter: ^2.8.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
